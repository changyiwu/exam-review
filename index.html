<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>考卷檢討</title>
<link rel="icon" type="image/webp" href="header-logo.webp">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- QR Code Library（位於登入關鍵路徑，改為本地載入以免教室網路阻擋 CDN 時無法掃碼登入） -->
<script src="vendor/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg-primary: #0a0b10;
    --bg-secondary: #12131e;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-primary: #8b5cf6;
    --accent-blue: #06b6d4;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --danger-color: #ef4444;
    --border-color: rgba(255, 255, 255, 0.08);
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-bg-hover: rgba(255, 255, 255, 0.06);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --glow-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --background-gradient: radial-gradient(circle at 10% 20%, rgba(15, 23, 42, 1) 0%, rgba(20, 15, 50, 1) 50%, rgba(10, 8, 28, 1) 100%);
    --font-base: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: var(--bg-primary);
    background-image: var(--background-gradient);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }

  .hidden { display: none !important; }

  /* ==================== 共用按鈕 ==================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--glass-bg);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
  }
  .btn:hover { background: var(--glass-bg-hover); transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-color: transparent;
    font-weight: 600;
  }
  .btn-primary:hover { box-shadow: var(--glow-shadow); }
  .btn-secondary { background: var(--bg-secondary); }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--text-secondary); }
  .btn-block { width: 100%; }
  .logout-btn { padding: 8px 14px; font-size: 0.9rem; }

  .alert {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    text-align: left;
  }
  .alert-danger {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fca5a5;
  }

  /* ==================== 登入畫面（大螢幕） ==================== */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--glass-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    box-shadow: var(--glass-shadow);
    padding: 40px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .login-logo {
    display: block;
    width: 112px;
    height: 112px;
    object-fit: contain;
    margin: 0 auto 16px;
    border-radius: 24px;
    filter: drop-shadow(0 8px 22px rgba(99, 102, 241, 0.4));
  }

  .login-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle {
    color: var(--accent-blue);
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 1px;
    margin-bottom: 24px;
  }

  .qr-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .qrcode-box {
    background: #fff;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    display: inline-block;
    min-width: 232px;
    min-height: 232px;
  }
  /* QR 函式庫會生成一個隱藏的 canvas 加一張 img，只對 img 下樣式——
     若連 canvas 也寫 display: block，就會冒出第二個 QR */
  .qrcode-box img { display: block; width: 200px; height: 200px; }
  .qr-placeholder {
    width: 200px; height: 200px;
    display: grid; place-items: center;
    color: #64748b; font-size: 0.85rem;
  }
  .qr-fallback {
    width: 200px;
    color: #0b0f19;
    font-size: 0.72rem;
    line-height: 1.4;
    word-break: break-all;
    text-align: left;
  }
  .qr-fallback a { color: #1d4ed8; }

  .qr-status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--text-secondary);
  }

  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background-color: var(--accent-blue);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.9); opacity: 0.4; }
    50%  { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.4; }
  }

  .direct-login-container { margin-bottom: 24px; }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-bottom: 16px;
    opacity: 0.7;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border-color);
  }
  .divider:not(:empty)::before { margin-right: .5em; }
  .divider:not(:empty)::after { margin-left: .5em; }

  .form-group-row { display: flex; gap: 10px; width: 100%; }
  .form-group-row input[type="password"] {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    font-size: 0.95rem;
  }
  .form-group-row button { flex-shrink: 0; }

  input[type="password"], input[type="text"] {
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: rgba(0, 0, 0, 0.25);
    color: var(--text-primary);
    font-family: inherit;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  input[type="password"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
  }

  .login-instructions {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
  }
  .login-instructions h3 {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }
  .login-instructions ol {
    padding-left: 20px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ==================== 手機授權畫面 ==================== */
  .mobile-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .mobile-card {
    background: var(--glass-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .mobile-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(139, 92, 246, 0.1);
    color: var(--accent-primary);
    font-size: 1.6rem;
    margin-bottom: 16px;
  }
  .mobile-header h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
  .mobile-header p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 22px; }
  .form-group { text-align: left; margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.88rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
  }
  .mobile-success { color: var(--accent-green); font-size: 3rem; margin-bottom: 12px; }

  /* ==================== 檔案畫面 ==================== */
  .app-shell { padding: 1.5rem; }
  .container { max-width: 1100px; margin: 0 auto; }

  .app-header {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.9rem; }
  .brand img { width: 48px; height: 48px; border-radius: 12px; }
  .brand h1 { font-size: clamp(1.25rem, 3vw, 1.7rem); font-weight: 700; }
  .brand p { color: var(--text-secondary); font-size: 0.88rem; }
  .header-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

  .session-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1.2rem;
    border-radius: 16px;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.25);
    margin-bottom: 1.25rem;
  }
  .session-info { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; }
  .session-info > i { color: var(--accent-green); }
  .countdown { font-weight: 700; font-variant-numeric: tabular-nums; }
  .countdown.warning { color: var(--accent-amber); }
  .countdown.critical { color: var(--danger-color); }

  .folder-group { margin-bottom: 1.1rem; }
  .folder-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.85rem 1.1rem;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background: var(--glass-bg);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: background var(--transition-fast);
  }
  .folder-head:hover { background: var(--glass-bg-hover); }
  .folder-head i.chevron { margin-left: auto; transition: transform var(--transition-fast); color: var(--text-secondary); }
  .folder-head.open i.chevron { transform: rotate(90deg); }
  .folder-head i.fa-folder, .folder-head i.fa-folder-open { color: var(--accent-amber); }
  .folder-body { padding: 0.75rem 0 0.25rem 1.1rem; }
  .folder-count { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; }

  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
    gap: 0.75rem;
  }
  .file-card {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.9rem 1rem;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background: var(--glass-bg);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
    transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
  }
  .file-card:hover {
    background: var(--glass-bg-hover);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }
  .file-card:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .file-icon {
    flex: none;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 1.1rem;
  }
  .file-icon.ppt { color: #f97316; }
  .file-icon.pdf { color: #ef4444; }
  .file-icon.img { color: #22d3ee; }
  .file-icon.other { color: var(--text-secondary); }

  /* min-width: 0 解掉 flex 的 min-content 底線；display: block 是必要的——
     text-overflow: ellipsis 對 inline 的 <span> 無效，長檔名會整條撐破卡片 */
  .file-meta { min-width: 0; display: block; }
  .file-name, .file-sub {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-name { font-weight: 500; }
  .file-sub { font-size: 0.78rem; color: var(--text-secondary); }

  .empty-state, .notice { text-align: center; color: var(--text-secondary); padding: 2.5rem 1rem; }
  .empty-state i { font-size: 2.2rem; display: block; margin-bottom: 0.8rem; opacity: 0.5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translateX(-50%) translateY(150%);
    padding: 0.8rem 1.4rem;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--border-color);
    box-shadow: var(--glass-shadow);
    font-size: 0.92rem;
    transition: transform var(--transition-normal);
    z-index: 50;
    max-width: min(90vw, 460px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }

  @media (max-width: 640px) {
    .login-card { padding: 28px 20px; }
    .app-shell { padding: 1rem; }
    .form-group-row { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ==================== 大螢幕登入 / QR CODE ==================== -->
<div id="desktop-login-view" class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <img src="header-logo.webp" class="login-logo" alt="" aria-hidden="true">
      <h1>考卷檢討</h1>
      <p class="subtitle">段考試卷檢討簡報</p>
    </div>

    <div class="qr-container">
      <div id="qrcode-box" class="qrcode-box">
        <div class="qr-placeholder">產生登入 QR Code…</div>
      </div>
      <div class="qr-status-indicator">
        <div class="pulse-dot"></div>
        <span id="qr-status-text">等待手機掃描登入中...</span>
      </div>
    </div>

    <div class="direct-login-container">
      <div class="divider"><span>或</span></div>
      <form id="desktop-login-form" class="direct-login-form">
        <div class="form-group-row">
          <input type="password" id="desktop-password" placeholder="請在大螢幕輸入通行碼" required autocomplete="current-password">
          <button type="submit" id="btn-desktop-login" class="btn btn-primary">
            <span class="btn-text">直接登入</span>
          </button>
        </div>
        <div id="desktop-login-error-msg" class="alert alert-danger hidden" style="margin-top: 10px;">
          <i class="fa-solid fa-circle-exclamation"></i> <span>通行碼錯誤</span>
        </div>
      </form>
    </div>

    <div class="login-instructions">
      <h3><i class="fa-solid fa-mobile-screen-button"></i> 教師登入步驟：</h3>
      <ol>
        <li>請用手機相機或 LINE 掃描上方 QR Code</li>
        <li>在手機上輸入通行碼進行授權</li>
        <li>大螢幕會自動解鎖並載入檔案</li>
      </ol>
    </div>
  </div>
</div>

<!-- ==================== 手機授權 ==================== -->
<div id="mobile-login-view" class="mobile-screen hidden">
  <div class="mobile-card">
    <div id="mobile-login-form-container">
      <div class="mobile-header">
        <div class="mobile-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>考卷檢討授權登入</h2>
        <p>請輸入通行碼，授權大螢幕開啟檔案</p>
      </div>
      <form id="mobile-login-form">
        <div class="form-group">
          <label for="mobile-password"><i class="fa-solid fa-lock"></i> 通行碼</label>
          <input type="password" id="mobile-password" placeholder="請輸入通行碼" required autocomplete="current-password">
        </div>
        <div id="login-error-msg" class="alert alert-danger hidden" style="margin-bottom: 16px;">
          <i class="fa-solid fa-circle-exclamation"></i> <span>通行碼錯誤</span>
        </div>
        <button type="submit" id="btn-mobile-login" class="btn btn-primary btn-block">
          <span class="btn-text">確認授權登入</span>
        </button>
      </form>
    </div>
    <div id="mobile-success" class="hidden">
      <div class="mobile-success"><i class="fa-solid fa-circle-check"></i></div>
      <h2>大螢幕已解鎖</h2>
      <p style="color:var(--text-secondary); margin-top:6px">可以放下手機了。</p>
    </div>
  </div>
</div>

<!-- ==================== 檔案畫面 ==================== -->
<div id="files-view" class="app-shell hidden">
  <div class="container">
    <header class="app-header">
      <div class="brand">
        <img src="header-logo.webp" alt="">
        <div>
          <h1>考卷檢討</h1>
          <p>段考試卷檢討簡報</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="https://changyiwu.github.io/teaching-web/" target="_blank" rel="noopener noreferrer"
           class="btn btn-secondary logout-btn"><i class="fa-solid fa-house"></i> 教學整合網</a>
        <button id="logout-btn" class="btn btn-secondary logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> 登出
        </button>
      </div>
    </header>

    <div class="session-bar">
      <div class="session-info">
        <i class="fa-solid fa-unlock"></i>
        <span>已登入，<span id="countdown" class="countdown">--:--</span> 後自動登出</span>
      </div>
      <span class="session-info" style="color:var(--text-secondary); font-size:0.85rem">
        <i class="fa-solid fa-circle-info"></i> 點檔案會在新分頁開啟
      </span>
    </div>

    <div id="tree"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // GAS 網頁應用程式端點。這不是秘密（通行碼與資料夾 ID 都只在後端），
  // 但更新部署一律用 clasp redeploy <deploymentId>，換成 deploy 會產生新網址，這裡就對不上了。
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzpXp7FktNfhSGTHyyM89V0_UW_G7eVd5CmjlXZxoqs2zdaVpmypIZtAVLnazQsdCS4/exec';

  const POLL_INTERVAL_MS = 3000;

  // ⚠️ session token 只存在記憶體：教室電視是任何人都走得到的裝置，
  // 存進 localStorage／sessionStorage 等於下課後學生也能繼續看。
  // 重新整理或關掉分頁就自動登出，重新掃碼只要幾秒。
  let sessionToken = null;
  let expiresAt = 0;
  let pairing = null;
  let pollTimer = null;
  let retryTimer = null;
  let countdownTimer = null;

  const $ = id => document.getElementById(id);

  // ===== API =====

  async function api(payload) {
    // 不帶 Content-Type，讓瀏覽器送成 text/plain 以避開 CORS preflight
    const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function sha256Hex(text) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  let toastTimer = null;
  function toast(message, isError) {
    const el = $('toast');
    el.textContent = message;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function showAlert(el, message) {
    if (!message) { el.classList.add('hidden'); return; }
    el.querySelector('span').textContent = message;
    el.classList.remove('hidden');
  }

  // ===== 大螢幕：配對通道與 QR Code =====

  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  // 前 4 次退避快速重試（0.8→6.4 秒），處理「剛登出／倒數歸零導覽時 fetch 被中斷」
  // 這種一秒內就會好的瞬間失敗；之後轉為固定 5 秒且**永不放棄**。
  // 教室電視是無人看顧的裝置，網路過幾分鐘才恢復時它必須自己好，不能停在那裡等人來按。
  const PAIRING_FAST_RETRY = 4;
  const PAIRING_SLOW_RETRY_MS = 5000;

  async function startPairing(attempt) {
    attempt = attempt || 0;
    stopPolling();
    clearTimeout(retryTimer);          // 避免手動按「重試」時跟排程中的重試疊成兩條鏈
    const box = $('qrcode-box');
    box.innerHTML = '<div class="qr-placeholder">產生登入 QR Code…</div>';
    $('qr-status-text').textContent = attempt ? '連線失敗，重試中...' : '正在建立登入通道...';

    try {
      const res = await api({ action: 'create_pairing' });
      if (!res.success) {
        // 後端有明確回覆（例如通道忙碌），這類要讓人看到原因，慢速重試即可
        scheduleRetry(attempt, res.error || '無法建立登入通道');
        return;
      }
      pairing = res;
      renderLoginQRCode();
      $('qr-status-text').textContent = '等待手機掃描登入中...';
      pollTimer = setInterval(pollPairing, POLL_INTERVAL_MS);
    } catch (err) {
      if (attempt < PAIRING_FAST_RETRY) {
        retryTimer = setTimeout(function () { startPairing(attempt + 1); }, 800 * Math.pow(2, attempt));
        return;
      }
      scheduleRetry(attempt, '連線失敗，持續重試中…');
    }
  }

  function scheduleRetry(attempt, message) {
    showPairingMessage(message);
    retryTimer = setTimeout(function () { startPairing(attempt + 1); }, PAIRING_SLOW_RETRY_MS);
  }

  function showPairingMessage(message) {
    $('qrcode-box').innerHTML = '<div class="qr-placeholder">' + escapeHtml(message) + '</div>';
    $('qr-status-text').innerHTML = '';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'btn btn-secondary logout-btn';
    retry.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 立即重試';
    retry.addEventListener('click', function () { startPairing(0); });
    $('qr-status-text').appendChild(retry);
  }

  function renderLoginQRCode() {
    // QR Code 只帶 pairId；領取 token 用的 pollKey 不會離開這台大螢幕
    const loginUrl = location.origin + location.pathname + '?pair=' + pairing.pairId;
    const box = $('qrcode-box');
    box.innerHTML = '';

    try {
      new QRCode(box, {
        text: loginUrl,
        width: 200,
        height: 200,
        colorDark: '#0b0f19',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      console.error('Failed to generate QR Code, using backup rendering', e);
      box.innerHTML = '<div class="qr-fallback">無法載入 QR Code 庫，請造訪此連結進行授權：<br>' +
                      '<a href="' + escapeHtml(loginUrl) + '" target="_blank" rel="noopener noreferrer">' +
                      escapeHtml(loginUrl) + '</a></div>';
    }
  }

  async function pollPairing() {
    if (!pairing) return;
    try {
      const res = await api({
        action: 'check_pairing',
        pairId: pairing.pairId,
        pollKey: pairing.pollKey
      });
      if (res.expired) { stopPolling(); startPairing(); return; }
      if (res.success && res.authenticated) {
        stopPolling();
        onUnlocked(res.session, res.expiresAt);
      }
    } catch (err) {
      /* 暫時性網路問題，下一輪再試 */
    }
  }

  // ===== 大螢幕：直接登入 =====

  $('desktop-login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const input = $('desktop-password');
    const btn = $('btn-desktop-login');
    if (!input.value) return;

    showAlert($('desktop-login-error-msg'), '');
    btn.disabled = true;
    try {
      const res = await api({ action: 'login', passwordHash: await sha256Hex(input.value) });
      input.value = '';
      if (res.success && res.authenticated) {
        stopPolling();
        onUnlocked(res.session, res.expiresAt);
      } else {
        showAlert($('desktop-login-error-msg'), res.error || '登入失敗');
      }
    } catch (err) {
      showAlert($('desktop-login-error-msg'), '連線失敗，請檢查網路');
    } finally {
      btn.disabled = false;
    }
  });

  // ===== 手機：授權大螢幕 =====

  $('mobile-login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const input = $('mobile-password');
    const btn = $('btn-mobile-login');
    if (!input.value) return;

    showAlert($('login-error-msg'), '');
    btn.disabled = true;
    try {
      const res = await api({
        action: 'login',
        pairId: new URLSearchParams(location.search).get('pair'),
        passwordHash: await sha256Hex(input.value)
      });
      input.value = '';
      if (res.success && res.paired) {
        $('mobile-login-form-container').classList.add('hidden');
        $('mobile-success').classList.remove('hidden');
      } else {
        showAlert($('login-error-msg'), res.error || '授權失敗');
      }
    } catch (err) {
      showAlert($('login-error-msg'), '連線失敗，請檢查網路');
    } finally {
      btn.disabled = false;
    }
  });

  // ===== 登入後 =====

  function onUnlocked(token, expiry) {
    sessionToken = token;
    expiresAt = expiry;
    $('desktop-login-view').classList.add('hidden');
    $('mobile-login-view').classList.add('hidden');
    $('files-view').classList.remove('hidden');
    startCountdown();
    loadTree();
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    const tick = () => {
      const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
      const el = $('countdown');
      el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' +
                       String(left % 60).padStart(2, '0');
      el.classList.toggle('warning', left <= 300 && left > 60);
      el.classList.toggle('critical', left <= 60);
      if (left <= 0) {
        // 整頁重載：把已渲染的檔名、記憶體裡的 token 一次清乾淨
        clearInterval(countdownTimer);
        location.reload();
      }
    };
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  $('logout-btn').addEventListener('click', async () => {
    try { await api({ action: 'logout', session: sessionToken }); } catch (err) { /* 重載即可 */ }
    location.href = location.origin + location.pathname;
  });

  // ===== 檔案樹 =====

  async function loadTree() {
    const tree = $('tree');
    tree.innerHTML = '<div class="notice"><i class="fa-solid fa-spinner fa-spin"></i> 讀取檔案中…</div>';
    try {
      const res = await api({ action: 'list_tree', session: sessionToken });
      if (!res.success) {
        if (res.code === 401) { location.reload(); return; }
        tree.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>' +
                         escapeHtml(res.error || '讀取失敗') + '</div>';
        return;
      }
      tree.innerHTML = '';
      if (!res.tree.length) {
        tree.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i>這個資料夾還沒有檔案</div>';
        return;
      }
      tree.appendChild(renderNodes(res.tree));
      if (res.truncated) toast('檔案數量較多，只列出前面一部分', true);
    } catch (err) {
      tree.innerHTML = '<div class="empty-state"><i class="fa-solid fa-plug-circle-xmark"></i>連線失敗，請重新整理</div>';
    }
  }

  function renderNodes(nodes) {
    const frag = document.createDocumentFragment();

    nodes.filter(n => n.type === 'folder').forEach(folder => {
      const group = document.createElement('div');
      group.className = 'folder-group';

      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'folder-head';
      head.innerHTML = '<i class="fa-solid fa-folder"></i>' +
                       '<span>' + escapeHtml(folder.name) + '</span>' +
                       '<span class="folder-count">' + countFiles(folder) + ' 個檔案</span>' +
                       '<i class="fa-solid fa-chevron-right chevron"></i>';

      const body = document.createElement('div');
      body.className = 'folder-body hidden';
      body.appendChild(renderNodes(folder.children || []));

      head.addEventListener('click', () => {
        const open = !body.classList.toggle('hidden');
        head.classList.toggle('open', open);
        head.querySelector('i.fa-folder, i.fa-folder-open').className =
          open ? 'fa-solid fa-folder-open' : 'fa-solid fa-folder';
      });

      group.appendChild(head);
      group.appendChild(body);
      frag.appendChild(group);
    });

    const files = nodes.filter(n => n.type === 'file');
    if (files.length) {
      const grid = document.createElement('div');
      grid.className = 'file-grid';
      files.forEach(file => grid.appendChild(renderFile(file)));
      frag.appendChild(grid);
    }

    return frag;
  }

  function countFiles(node) {
    if (node.type === 'file') return 1;
    return (node.children || []).reduce((sum, child) => sum + countFiles(child), 0);
  }

  const ICONS = [
    { test: /presentation|powerpoint|\.pptx?$/i, cls: 'ppt', icon: 'fa-file-powerpoint' },
    { test: /pdf/i,                              cls: 'pdf', icon: 'fa-file-pdf' },
    { test: /image\//i,                          cls: 'img', icon: 'fa-file-image' }
  ];

  function renderFile(file) {
    const probe = (file.mimeType || '') + ' ' + file.name;
    const match = ICONS.find(entry => entry.test.test(probe)) || { cls: 'other', icon: 'fa-file' };

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'file-card';
    card.innerHTML =
      '<span class="file-icon ' + match.cls + '"><i class="fa-solid ' + match.icon + '"></i></span>' +
      '<span class="file-meta">' +
        '<span class="file-name">' + escapeHtml(file.name) + '</span>' +
        '<span class="file-sub">' + escapeHtml(file.modified || '') + ' · ' + formatSize(file.size) + '</span>' +
      '</span>';

    card.addEventListener('click', () => openFile(file, card));
    return card;
  }

  async function openFile(file, card) {
    // 先在使用者手勢裡開好空白分頁，等網址回來再導過去；
    // 等 fetch 完成才 window.open 會被彈出視窗封鎖擋掉。
    const tab = window.open('about:blank', '_blank');
    if (tab) tab.opener = null;

    card.disabled = true;
    try {
      const res = await api({ action: 'get_file_url', session: sessionToken, handle: file.handle });
      if (res.success && res.url) {
        if (tab) tab.location.href = res.url;
        else toast('瀏覽器擋下了新分頁，請允許此網站開啟彈出視窗', true);
      } else {
        if (tab) tab.close();
        if (res.code === 401) { location.reload(); return; }
        toast(res.error || '無法開啟檔案', true);
      }
    } catch (err) {
      if (tab) tab.close();
      toast('連線失敗，請重新整理', true);
    } finally {
      card.disabled = false;
    }
  }

  function formatSize(bytes) {
    const n = Number(bytes);
    if (!n || isNaN(n)) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  // ===== 啟動：帶 ?pair= 就是手機掃碼進來的授權頁 =====

  if (new URLSearchParams(location.search).get('pair')) {
    $('desktop-login-view').classList.add('hidden');
    $('mobile-login-view').classList.remove('hidden');
    setTimeout(() => $('mobile-password').focus(), 150);
  } else {
    startPairing();
  }
})();
</script>

</body>
</html>
